<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Debt Payment History</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#fb7e51", // coral
                        "magenta": "#e11d48", // rose/magenta
                        "purple-accent": "#8b5cf6",
                        "plum": "#4a3b5c", // soft plum
                        "plum-light": "#2d2438", // plum tint for notes
                        "background-dark": "#0f0d15", // deep charcoal
                        "surface-dark": "#1e1b26",
                        "surface-dark-light": "#2a2635",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "serif": ["Playfair Display", "serif"],
                    },
                    borderRadius: {
                        "2xl": "1.5rem",
                        "3xl": "2rem",
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .magenta-coral-gradient {
                background: linear-gradient(135deg, #e11d48 0%, #fb7e51 100%);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body >




<div class="fixed inset-0 z-40 bg-background-dark/80 backdrop-blur-sm flex items-end justify-center">
<div class="w-full max-w-[430px] bg-surface-dark
 rounded-t-3xl shadow-2xl overflow-hidden relative border-t border-white/10">
<button class="absolute top-6 right-6 z-50 size-8 flex items-center justify-center bg-black/20 hover:bg-black/40 rounded-full text-white/80 transition-colors">
<span class="material-symbols-outlined text-xl">close</span>
</button>
<div class="magenta-coral-gradient pt-16 pb-12 px-8 flex flex-col items-center justify-center text-center">
<span class="text-white/70 text-xs font-semibold uppercase tracking-[0.2em] mb-2">Total Amount Paid</span>
<h1 class="text-5xl font-serif text-white tracking-tight">$1,850.00</h1>
</div>
<div class="px-8 pt-8 pb-12 space-y-8">
<div class="flex flex-col gap-1">
<span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Transaction Name</span>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-magenta text-xl">home</span>
<span class="text-lg font-medium text-slate-100">Home Mortgage Payment</span>
</div>
</div>
<div class="flex flex-col gap-1">
<span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Payment Date</span>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-magenta text-xl">calendar_today</span>
<span class="text-lg font-medium text-slate-100">May 12, 2024</span>
</div>
</div>
<div class="flex flex-col gap-2">
<span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Note</span>
<div class="bg-plum-light/50 border border-plum/30 rounded-2xl p-4">
<p class="text-sm text-slate-300 leading-relaxed italic">
                                "Final payment for the quarterly cycle"
                            </p>
</div>
</div>
<div class="pt-4 flex flex-col items-center gap-6">
<button class="text-primary/60 hover:text-primary text-sm font-semibold transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-lg">delete</span>
                            Delete Transaction
                        </button>
</div>
</div>
<div class="h-1.5 w-32 bg-white/10 rounded-full mx-auto mb-2"></div>
</div>
</div>


</body></html>
